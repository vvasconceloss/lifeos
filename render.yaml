# Render blueprint for the LifeOS API (free plan).
# Docs: docs/ops/DEPLOYMENT.md
# Note: the PostgreSQL database is hosted externally on Neon — its connection
# string is provided as the DATABASE_URL env var (no `databases` block here).
services:
  - type: web
    name: lifeos-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @lifeos/api build
    startCommand: pnpm --filter @lifeos/api start
    preDeployCommand: pnpm --filter @lifeos/api migrate:deploy
    healthCheckPath: /v1/health/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "3000"
      - key: LOG_LEVEL
        value: info
      - key: RATE_LIMIT_MAX
        value: "300"
      - key: RATE_LIMIT_WINDOW
        value: 1 minute
      - key: LOGIN_RATE_LIMIT_MAX
        value: "5"
      - key: LOGIN_RATE_LIMIT_WINDOW
        value: 1 minute
      - key: REGISTER_RATE_LIMIT_MAX
        value: "10"
      - key: REGISTER_RATE_LIMIT_WINDOW
        value: 1 minute
      - key: FORGOT_PASSWORD_RATE_LIMIT_MAX
        value: "3"
      - key: FORGOT_PASSWORD_RATE_LIMIT_WINDOW
        value: 1 hour
      - key: RESET_PASSWORD_RATE_LIMIT_MAX
        value: "10"
      - key: RESET_PASSWORD_RATE_LIMIT_WINDOW
        value: 1 hour
      # Transactional email. SMTP to smtp.gmail.com is blocked from Render free
      # instances (Gmail drops datacenter SMTP), so production uses the Gmail
      # REST API over HTTPS (EMAIL_PROVIDER=gmail-api) with OAuth2 credentials
      # set as secrets in the Render dashboard:
      #   GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET / GOOGLE_OAUTH_REFRESH_TOKEN
      #   GOOGLE_OAUTH_USER
      - key: EMAIL_ENABLED
        value: "true"
      - key: EMAIL_PROVIDER
        value: gmail-api
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "465"
      - key: EMAIL_SECURE
        value: "true"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM_NAME
        value: LifeOS
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      # Gmail API OAuth2 (used when EMAIL_PROVIDER=gmail-api).
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_OAUTH_USER
        sync: false
      # Web origin used to build verification/reset links in emails. MUST be the
      # public Vercel origin (email clients cannot reach localhost).
      - key: WEB_URL
        value: https://lifeos-focus.vercel.app
      # Set these in the Render dashboard (never commit secrets):
      # - DATABASE_URL  -> Neon PostgreSQL connection string (include ?sslmode=require)
      # - JWT_SECRET    -> long random value (openssl rand -hex 32)
      # - ALLOWED_ORIGINS -> comma-separated production origins, e.g. https://your-app.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
