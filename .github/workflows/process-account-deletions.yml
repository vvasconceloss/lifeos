name: Process account deletions

on:
  schedule:
    # Daily at 02:30 UTC — permanently deletes accounts whose 15-day window elapsed.
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  process-deletions:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EMAIL_ENABLED: "true"
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: "465"
      EMAIL_SECURE: "true"
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      EMAIL_FROM_NAME: LifeOS
      EMAIL_FROM_ADDRESS: ${{ secrets.EMAIL_USER }}
      EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
      WEB_URL: ${{ secrets.WEB_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Process due account deletions
        run: pnpm --filter @lifeos/api jobs:process-account-deletions
