<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LifeOS is a personal system for turning the life you want into habits you can actually keep — then showing you what is working." />
    <meta property="og:title" content="LifeOS — Build a life you can measure, understand, and improve." />
    <meta property="og:description" content="Track habits, build goals, and understand your progress with a quiet, focused habit tracker." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/lifeos-black-icon.png" />
    <meta name="twitter:card" content="summary" />
    <title>LifeOS — Build a life you can measure, understand, and improve</title>
    <script>
        (function () {
            var savedTheme = localStorage.getItem("theme");
            var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            var dark = savedTheme === "dark" || (savedTheme !== "light" && systemDark);
            var root = document.documentElement;
            if (dark) {
                root.classList.add("dark");
            }
            root.style.colorScheme = dark ? "dark" : "light";
            root.style.backgroundColor = dark ? "oklch(0.12 0.006 270)" : "oklch(1 0 0)";
        })();
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
